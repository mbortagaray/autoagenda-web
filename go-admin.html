<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
</head>
<body>
  <p>Redirecionando para o painel admin...</p>
  <script>
    // O Supabase coloca os tokens no hash (#access_token=...).
    // Mantemos os tokens no hash e passamos impersonating=true na query,
    // para que o modo sobreviva quando o Supabase limpar o hash.
    const hash = window.location.hash.substring(1)
    const query = window.location.search.substring(1)
    const params = hash || query
    const adminUrl = 'https://agenda.mdinamic.com.br/admin/?impersonating=true'

    if (params) {
      window.location.replace(adminUrl + '#' + params)
    } else {
      window.location.replace(adminUrl)
    }
  </script>
</body>
</html>
