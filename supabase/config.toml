project_id = "autoagenda-web"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true

[auth]
enabled = true
site_url = "https://agenda.mdinamic.com.br"
additional_redirect_urls = [
  "https://agenda.mdinamic.com.br/go-admin",
  "https://agenda.mdinamic.com.br/admin/",
  "https://agenda.mdinamic.com.br/superadmin"
]

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "per_worker"
